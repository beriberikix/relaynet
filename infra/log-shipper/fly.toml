# Ships the relay's logs (Fly's NATS log stream) to Grafana Cloud Loki.
# Secrets: ORG, ACCESS_TOKEN (read-only org token), SUBJECT, LOKI_URL,
# LOKI_USERNAME, LOKI_PASSWORD. Deployed by .github/workflows/deploy-log-shipper.yml.
app = "relaynet-logs"
primary_region = "sjc"

[build]
  # Pinned by digest: the image is third-party and holds the org's log
  # token. This is the `latest` build running since setup (newer than the
  # v0.0.11 tag); bump deliberately after reading the upstream changes.
  image = "ghcr.io/superfly/fly-log-shipper@sha256:844d084753fa29f2f45e3fa37711615793816859929727fb4f01a11c62a3c642"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
