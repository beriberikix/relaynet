version: 2
updates:
  # The relay pins the fork by release tarball; Dependabot cannot bump that,
  # so this covers the container base image, the web tooling and the
  # workflows' actions (pinned by commit; Dependabot updates hash and comment).
  - package-ecosystem: docker
    directory: /relay
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      tooling:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
