name: relay probe

# On-demand end-to-end check of the hosted relay (auth, DHCP, DNS egress)
# with the dedicated "probe" account, reporting to the Better Stack heartbeat.
# The scheduled probe runs every 5 minutes as the Cloudflare Worker in
# infra/probe-worker; GitHub's cron skipped most hourly runs and set off
# missed-heartbeat alerts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: infra/probe
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Probe relay.relaynet.network
        env:
          RELAY_TOKEN: ${{ secrets.PROBE_RELAY_TOKEN }}
        run: node infra/probe/probe.mjs
      - name: Heartbeat
        if: success()
        env:
          HEARTBEAT_URL: ${{ secrets.BETTERSTACK_PROBE_HEARTBEAT_URL }}
        run: curl -fsS -m 10 --retry 3 "$HEARTBEAT_URL" > /dev/null
      - name: Report failure
        if: failure()
        env:
          HEARTBEAT_URL: ${{ secrets.BETTERSTACK_PROBE_HEARTBEAT_URL }}
        run: curl -fsS -m 10 --retry 3 "$HEARTBEAT_URL/fail" > /dev/null
