name: relay probe

# On-demand end-to-end check of the hosted relay (auth, DHCP, DNS egress)
# with the dedicated "probe" account, reporting to the Better Stack heartbeat.
# The scheduled probe runs every 5 minutes as the Cloudflare Worker in
# infra/probe-worker; GitHub's cron skipped most hourly runs and set off
# missed-heartbeat alerts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra/probe
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe relay.relaynet.network
        env:
          RELAY_TOKEN: ${{ secrets.PROBE_RELAY_TOKEN }}
        run: node infra/probe/probe.mjs
      - name: Heartbeat
        if: success()
        run: curl -fsS -m 10 --retry 3 "${{ secrets.BETTERSTACK_PROBE_HEARTBEAT_URL }}" > /dev/null
      - name: Report failure
        if: failure()
        run: curl -fsS -m 10 --retry 3 "${{ secrets.BETTERSTACK_PROBE_HEARTBEAT_URL }}/fail" > /dev/null
