# Fly.io config for the relay. Deploy with `fly deploy` from this directory.
# Secrets are set once with `fly secrets set` (see README.md).
app = "relaynet"
primary_region = "sjc"

# Litestream forwards the stop signal to the relay, waits for it, then does a
# final sync to R2; give that room before Fly force-kills the machine.
kill_timeout = 15

[build]
  dockerfile = "Dockerfile"

[env]
  # Cloudflare fronts relay.relaynet.network and puts the real client address
  # in CF-Connecting-IP...
  TRUST_PROXY = "true"
  CLIENT_IP_HEADER = "cf-connecting-ip"
  TRUST_PROXY_HOPS = "1"
  # ...but only when the request really came through Cloudflare: Fly reports
  # the connecting edge in Fly-Client-IP (and overwrites client values), and
  # CF-Connecting-IP is believed only from Cloudflare's published ranges
  # (https://www.cloudflare.com/ips/, checked 2026-10-14). Direct hits on
  # relaynet.fly.dev are attributed to their real address.
  PEER_IP_HEADER = "fly-client-ip"
  TRUSTED_PROXY_CIDRS = "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"

  # Browser origins allowed to call the account API (/api/me): the dashboard.
  ALLOWED_ORIGINS = "https://relaynet.network,https://beriberikix.github.io"
  # Any page may open a session: sessions authenticate with the user's API
  # token, never a cookie, so the origin adds no protection and only blocks
  # people embedding relaynet in their own sites.
  SESSION_ALLOWED_ORIGINS = "*"

  # TCP window toward VMs: the largest possible without window scaling. The
  # 10 KiB default caps each connection at 10 KiB per round trip (about
  # 40 KB/s for a user 250 ms away); 64 KiB with slow start is ~5x faster.
  TCP_WINDOW_SIZE = "65535"

  # No anonymous tier: every session needs an account (invite-only beta).
  ANON_ENABLED = "false"

  # New Auth0 sign-ups start pending until they redeem an invite code
  # (created in the operator panel under Invites).
  SIGNUP_MODE = "invite"

  # The operator panel is public at https://admin.relaynet.network: the
  # public listener hands requests for that name to the admin app (relay
  # sessions are refused there, and METRICS_PUBLIC does not apply). Sign-in
  # is Auth0 SSO with MFA only. The admin port 8001 itself stays private, for
  # the metrics scraper only; Fly's private network is IPv6-only, so it binds "::".
  ADMIN_PUBLIC_HOST = "admin.relaynet.network"
  ADMIN_BIND_ADDRESS = "::"
  # TLS ends at Fly's proxy, which sets X-Forwarded-Proto; trusting it is what
  # lets the Secure session cookie be set.
  ADMIN_COOKIE_SECURE = "true"
  ADMIN_TRUST_PROXY = "true"
  # Operator single sign-on through Auth0 (app relaynet-admin, MFA required).
  # Client id and secret are Fly secrets; without them SSO stays off.
  ADMIN_OIDC_ISSUER = "https://jonathanberi.us.auth0.com/"
  ADMIN_OIDC_REDIRECT_URL = "https://admin.relaynet.network/auth/callback"
  # SSO only: the password form and POST /api/login are disabled.
  ADMIN_PASSWORD_LOGIN = "false"
  # Port 8001 answers only /metrics: other apps in the Fly org share the
  # private network, so the panel is served only on admin.relaynet.network.
  ADMIN_PRIVATE_METRICS_ONLY = "true"

  # Fly's metrics scraper reads /metrics over the private network without auth.
  METRICS_ENABLED = "true"
  METRICS_PUBLIC = "true"
  # Fly scrapes only one [[metrics]] endpoint, so the relay appends Litestream's.
  METRICS_MERGE_URLS = "http://127.0.0.1:9090/metrics"

  # Litestream target: R2 bucket and prefix.
  LITESTREAM_BUCKET = "relaynet-backups"
  LITESTREAM_REPLICA_PATH = "prod"

[http_service]
  internal_port = 8086
  force_https = true
  # One always-on machine: sessions and the IP pool live in memory.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    # The 10.0.2.0/24 pool holds 240 sessions; leave headroom for health checks.
    type = "connections"
    soft_limit = 200
    hard_limit = 260

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "relay_data"
  destination = "/data"
  initial_size = "1gb"

[[metrics]]
  port = 8001
  path = "/metrics"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
